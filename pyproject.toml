[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "schema-engine"
version = "0.3.0"
description = "Cost-aware AI ETL engine: an LLM writes Pandas transforms from metadata only, and they run locally in a sandbox."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "igoresik" }]
dependencies = [
    "pandas>=2.1",
    "openpyxl>=3.1",
    "typer>=0.12",
    "httpx>=0.27",
]

[project.optional-dependencies]
app = [
    "keyring>=25",
    "fastapi>=0.162",
    "uvicorn>=0.54",
    "pywebview>=6.2; sys_platform == 'win32'",
]
dev = [
    "schema-engine[app]",
    "httpx2>=2.16",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]

[project.scripts]
schema-engine = "schema_engine.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/schema_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["schema_engine"]
branch = true
# entry points that only start a server or a window
omit = ["*/schema_engine/app/__main__.py", "*/schema_engine/app/desktop.py"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
