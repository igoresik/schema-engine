name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Smoke-test CLI
        run: |
          schema-engine samples samples --rows 20
          schema-engine profile samples/dirty_orders.csv --compact > /dev/null
          schema-engine profile samples/dirty_orders.xlsx --privacy-mode none --compact > /dev/null
          schema-engine apply examples/clean_orders.py samples/dirty_orders.csv -o samples/clean.csv
          schema-engine apply examples/clean_orders.py samples/dirty_orders.csv -o samples/clean.sql
          python -c "import sqlite3; sqlite3.connect(':memory:').executescript(open('samples/clean.sql').read())"
