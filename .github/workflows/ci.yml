name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Smoke-test CLI
        run: |
          schema-engine samples samples --rows 20
          schema-engine profile samples/dirty_orders.csv --compact > /dev/null
          schema-engine profile samples/dirty_orders.xlsx --privacy-mode none --compact > /dev/null
          schema-engine apply examples/clean_orders.py samples/dirty_orders.csv -o samples/clean.csv
          schema-engine apply examples/clean_orders.py samples/dirty_orders.csv -o samples/clean.sql
          python -c "import sqlite3; sqlite3.connect(':memory:').executescript(open('samples/clean.sql').read())"
      - name: Keep coverage report
        if: github.ref == 'refs/heads/main' && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  coverage-badge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: coverage
      - name: Push badge to the badges branch
        run: |
          python .github/scripts/coverage_badge.py coverage.xml "$RUNNER_TEMP/coverage.json"
          git fetch origin badges || true
          git switch badges 2>/dev/null || git switch --orphan badges
          cp "$RUNNER_TEMP/coverage.json" coverage.json
          git add coverage.json
          git diff --cached --quiet && exit 0
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "coverage badge"
          git push origin badges
